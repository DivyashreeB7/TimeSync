<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | TimeSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main style="max-width:420px; margin:60px auto; padding:24px;">
        <h1>Forgot Password? 💌</h1>
        <p>Enter the email address registered with TimeSync.</p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Email address</label>
            <input
                id="email"
                type="email"
                name="email"
                autocomplete="email"
                required
                style="display:block; width:100%; box-sizing:border-box; padding:12px; margin:12px 0;"
            >
            <button type="submit">Request password reset</button>
        </form>

        <p><a href="{{ url_for('login') }}">← Back to login</a></p>
    </main>
</body>
</html>
